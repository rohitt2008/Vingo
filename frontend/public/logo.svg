<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#ff4d2d"/>
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ff4d2d" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#logoGrad)" />
  
  <!-- Glowing Delivery Scooter Icon in the Center -->
  <g filter="url(#dropShadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Motion Lines (Left Side) -->
    <line x1="80" y1="220" x2="140" y2="220" stroke-width="20" stroke-opacity="0.6"/>
    <line x1="60" y1="280" x2="150" y2="280" stroke-width="20" stroke-opacity="0.8"/>
    <line x1="90" y1="340" x2="130" y2="340" stroke-width="20" stroke-opacity="0.4"/>
    
    <!-- Delivery Box (Back of scooter) -->
    <rect x="180" y="160" width="90" height="90" rx="12" fill="#ffffff" stroke="none"/>
    <path d="M210 160 L210 250" stroke="#ff4d2d" stroke-width="8"/>
    <path d="M180 205 L270 205" stroke="#ff4d2d" stroke-width="8"/>
    
    <!-- Scooter Frame & Seat -->
    <path d="M225 250 L310 250 L360 350 L420 350" />
    <path d="M310 250 L345 180 L400 180" />
    
    <!-- Handlebar & Headlight Shield -->
    <path d="M380 150 L345 180" />
    <circle cx="410" cy="180" r="10" fill="#ffffff" stroke="none"/>
    
    <!-- Rear Wheel -->
    <circle cx="210" cy="350" r="40" fill="none" stroke="#ffffff" stroke-width="24"/>
    <circle cx="210" cy="350" r="12" fill="#ffffff" stroke="none"/>
    
    <!-- Front Wheel -->
    <circle cx="360" cy="350" r="40" fill="none" stroke="#ffffff" stroke-width="24"/>
    <circle cx="360" cy="350" r="12" fill="#ffffff" stroke="none"/>
  </g>
</svg>
