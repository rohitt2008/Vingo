name: Vingo CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Backend Build & Lint Check
  backend_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify Backend Server Code Compiles
        run: |
          cd backend
          node --check src/app.js

  # Frontend Build & Validate Check
  frontend_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate Production Client Build compiles
        run: |
          cd frontend
          npm run build --if-present

  # Docker Integrity Build Check
  docker_ci:
    runs-on: ubuntu-latest
    needs: [backend_ci, frontend_ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify Docker Compose config integrity
        run: docker compose config
